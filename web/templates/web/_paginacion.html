{% if page.paginator.num_pages > 1 %}
<nav class="pager" aria-label="Paginación">
  {% if page.has_previous %}<a class="btn quiet" href="?pagina={{ page.previous_page_number }}" rel="prev"><svg class="icon" aria-hidden="true"><use href="#i-caret-left"/></svg>Anterior</a>{% else %}<span class="btn quiet" aria-disabled="true"><svg class="icon" aria-hidden="true"><use href="#i-caret-left"/></svg>Anterior</span>{% endif %}
  <span class="muted">Página {{ page.number }} de {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a class="btn quiet" href="?pagina={{ page.next_page_number }}" rel="next">Siguiente<svg class="icon" aria-hidden="true"><use href="#i-caret-right"/></svg></a>{% else %}<span class="btn quiet" aria-disabled="true">Siguiente<svg class="icon" aria-hidden="true"><use href="#i-caret-right"/></svg></span>{% endif %}
</nav>
{% endif %}
